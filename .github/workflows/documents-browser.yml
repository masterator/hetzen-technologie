name: Documents template browser test

on:
  push:
    branches: ["fix/documents-template-restore"]
  pull_request:
    branches: ["main"]

jobs:
  documents-browser:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Install Node dependency
        run: npm install --no-save playwright@1.56.1

      - name: Run real-browser document tests
        run: node .github/documents-browser-test.mjs

      - name: Upload document screenshots and PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documents-browser-evidence
          path: test-artifacts/
          if-no-files-found: ignore
